<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard – Phishing Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tags">
    <a href="index.html" class="tag">Home</a>
    <a href="dashboard.html" class="tag active">Dashboard</a>
    <a href="about.html" class="tag">About</a>
    <a href="help.html" class="tag">Help</a>
</div>

<div class="container">
    <nav>
        <a href="index.html"></a>
        <a href="dashboard.html"></a>
        <a href="about.html"></a>
        <a href="help.html"></a>
    </nav>

    <!-- Risk Score -->
    <div class="risk-score">
        <h2>⚠️ Risk Score</h2>
        <div class="progress-bar">
            <div id="riskFill"></div>
        </div>
        <p id="riskText">0% Risk</p>
    </div>

    <!-- Statistics -->
    <div class="stats">
        <h2>📊 Statistics</h2>
        <div class="stat-box safe">
            ✅ Safe URLs: <span id="safeCount">0</span>
        </div>
        <div class="stat-box phishing">
            ⚠️ Phishing URLs: <span id="phishingCount">0</span>
        </div>
        <div class="stat-box total">
            🔢 Total Checked: <span id="totalCount">0</span>
        </div>
    </div>

     <!-- Scrollable URL History -->
    <div class="history dashboard-history">
        <h2>📜 Recent History</h2>
        <ul id="historyList"></ul>
        <button class="clear-btn" onclick="clearHistory()">Clear History</button>
    </div>

</div>

<script src="script.js"></script>
<script>
    // Load dashboard data when page opens
    loadHistory();
    updateStatistics();
    loadRiskScore();
</script>

</body>
</html>
